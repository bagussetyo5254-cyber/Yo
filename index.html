<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 01001000</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital@1&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080610;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.2;
    pointer-events: none;
    animation: drift ease-in-out infinite alternate;
  }
  .orb1 { width: 420px; height: 420px; background: #ff5fa8; top:-120px; left:-120px; animation-duration:9s; }
  .orb2 { width: 320px; height: 320px; background: #9b59f7; bottom:-80px; right:-80px; animation-duration:11s; }
  .orb3 { width: 180px; height: 180px; background: #ff9de2; top:50%; left:50%; transform:translate(-50%,-50%); animation-duration:6s; }

  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(25px,18px) scale(1.08); }
  }

  .petal {
    position: fixed;
    border-radius: 50% 0 50% 0;
    opacity: 0;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity:0; }
    10%  { opacity:.6; }
    90%  { opacity:.3; }
    100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
  }

  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 56px 80px 48px;
    border: 1px solid rgba(255,110,170,0.18);
    border-radius: 28px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    box-shadow: 0 0 80px rgba(255,80,150,0.12), inset 0 0 40px rgba(255,255,255,0.03);
    animation: cardIn 1.2s cubic-bezier(0.16,1,0.3,1) both;
    max-width: 90vw;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(40px) scale(0.94); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .label {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(255,160,210,0.5);
    text-transform: uppercase;
    margin-bottom: 28px;
    animation: fadeUp 1s 0.3s both;
  }

  .code-name {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: 2px;
    color: rgba(255,150,200,0.4);
    margin-bottom: 8px;
    animation: fadeUp 1s 0.5s both;
  }

  .hint-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 10px;
  }

  .main-link {
    display: inline-block;
    font-family: 'Dancing Script', cursive;
    font-size: clamp(60px, 11vw, 92px);
    font-weight: 700;
    text-decoration: none;
    background: linear-gradient(135deg, #ff6fa8 0%, #ffb3d9 38%, #c77dff 68%, #ff6fa8 100%);
    background-size: 220% 220%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease infinite, fadeUp 1s 0.6s both;
    filter: drop-shadow(0 0 22px rgba(255,100,160,0.45));
    transition: transform 0.3s ease, filter 0.3s ease;
  }
  .main-link:hover {
    transform: scale(1.06) translateY(-5px);
    filter: drop-shadow(0 0 45px rgba(255,100,160,0.9));
  }
  @keyframes shimmer {
    0%  { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  .decoded {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255,170,220,0.7);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .hint-wrap:hover .decoded { opacity: 1; }

  .sub {
    margin-top: 32px;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(255,155,205,0.4);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    animation: fadeUp 1s 0.9s both;
  }

  .hearts {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
    animation: fadeUp 1s 1.1s both;
  }
  .heart { color: rgba(255,100,160,0.55); font-size: 14px; animation: hb 1.5s ease-in-out infinite; }
  .heart:nth-child(2) { animation-delay:.25s; color:rgba(180,90,255,0.55); }
  .heart:nth-child(3) { animation-delay:.5s; }
  @keyframes hb {
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.35); }
  }

  .sp {
    position: absolute;
    border-radius: 50%;
    animation: spk 2.2s ease-in-out infinite;
    pointer-events: none;
  }
  .sp:nth-child(1){ width:5px;height:5px;background:#ffb3d9;top:12%;left:6%;animation-delay:0s; }
  .sp:nth-child(2){ width:4px;height:4px;background:#c77dff;top:18%;right:8%;animation-delay:.5s; }
  .sp:nth-child(3){ width:5px;height:5px;background:#ff6fa8;bottom:18%;left:9%;animation-delay:.9s; }
  .sp:nth-child(4){ width:4px;height:4px;background:#ffb3d9;bottom:12%;right:6%;animation-delay:1.3s; }
  .sp:nth-child(5){ width:6px;height:6px;background:#e040fb;top:50%;left:2%;animation-delay:.7s; }
  .sp:nth-child(6){ width:5px;height:5px;background:#ffb3d9;top:48%;right:2%;animation-delay:1.6s; }
  @keyframes spk {
    0%,100%{ transform:scale(0) rotate(0); opacity:0; }
    50%    { transform:scale(1.6) rotate(180deg); opacity:1; }
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="card">
  <div class="sp"></div><div class="sp"></div><div class="sp"></div>
  <div class="sp"></div><div class="sp"></div><div class="sp"></div>

  <div class="label">✦ &nbsp; pesan tersembunyi &nbsp; ✦</div>

  <div class="hint-wrap">
    <a class="main-link" href="#">✿ ayg cantik ✿</a>
  </div>

  <p class="sub">rahasia kita berdua ♡</p>

  <div class="hearts">
    <span class="heart">♥</span>
    <span class="heart">♥</span>
    <span class="heart">♥</span>
  </div>
</div>

<script>
  const colors = ['#ff6fa8','#ffb3d9','#c77dff','#e040fb','#ff9de2'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    const s = 5 + Math.random() * 9;
    p.style.width = p.style.height = s + 'px';
    p.style.animationDuration = (7 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50% 0 50% 0' : '50%';
    document.body.appendChild(p);
  }
</script>
</body>
</html>
